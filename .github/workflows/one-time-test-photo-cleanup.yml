name: Einmalige Entfernung von 11 Foto-Testartikeln

on:
  push:
    branches:
      - feature/foto-massenimport-beta-20261105
    paths:
      - '.github/workflows/one-time-test-photo-cleanup.yml'

permissions:
  contents: read
  id-token: write

jobs:
  delete-exact-test-articles:
    if: github.repository == 'Bookiii92/KaufMich24'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Nur mit signierter GitHub-Identität exakt 11 freigegebene Testartikel entfernen
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          oidc_response="$(curl -fsSL --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=km24-delete-11-testphotos-20261105")"
          jwt="$(python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])' <<< "$oidc_response")"
          unset oidc_response
          status="$(curl --silent --show-error --max-time 100 \
            -X POST \
            -H "Authorization: Bearer ${jwt}" \
            -H "Content-Type: application/json" \
            -o "$RUNNER_TEMP/km24-photo-cleanup-result.json" \
            -w '%{http_code}' \
            'https://aaqqcnrnrvybboirrrtd.supabase.co/functions/v1/km24-cleanup-test-photo-once-20261105')"
          unset jwt
          echo "Cleanup response status: $status"
          cat "$RUNNER_TEMP/km24-photo-cleanup-result.json"
          test "$status" = "200"
          python3 - "$RUNNER_TEMP/km24-photo-cleanup-result.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1],encoding='utf-8'))
          assert result.get('success') is True, 'Cleanup did not succeed'
          for key in ['deletedListings','deletedDrafts','publicImagesRemoved','privateImagesRemoved']:
              assert result.get(key)==11, f'Unexpected cleanup quantity: {key}'
          print('PASS: exactly 11 test listings and both kinds of images removed')
          PY
